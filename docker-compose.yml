services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-network_viz}
      POSTGRES_USER: ${POSTGRES_USER:-network_viz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-network_viz}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-network_viz} -d ${POSTGRES_DB:-network_viz}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
